     <section id="connexion-professionnel" style="background:white;padding:20px;margin:20px auto;max-width:650px;border-radius:14px;">

</section> 
      margin: 0;

    button {

<body>
  <header>
    <h1>RESERVIO</h1>
    <p>Votre réservation, simplement.</p>
  </header>

  <main>
    <div class="card">
      <h2>Bienvenue sur RESERVIO</h2>
      <p>Réservez facilement un service auprès d'un professionnel.</p>

      <form id="reservationForm">
        <label for="nom">Votre nom</label>
        <input id="nom" type="text" placeholder="Entrez votre nom" required>

        <label for="telephone">Votre téléphone</label>
        <input id="telephone" type="tel" placeholder="Votre numéro" required>

        <label for="service">Type de service</label>
        <select id="service" required>
          <option value="">Choisir un service</option>
          <option>Salon de coiffure</option>
          <option>Beauté et esthétique</option>
          <option>Hôtel</option>
          <option>Restaurant</option>
          <option>Autre service</option>
        </select>

        <label for="date">Date souhaitée</label>
        <input id="date" type="date" required>

        <label for="heure">Heure souhaitée</label>
        <input id="heure" type="time" required>

        <button type="submit">Demander une réservation</button>
      </form>

      <div id="message"></div>
    </div>
  </main>

  <footer>© 2026 RESERVIO - Tous droits réservés</footer>

  <script>
    document.getElementById("reservationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Votre demande est prête ! La connexion au système de réservation sera ajoutée ensuite.";
    });
  </script>
